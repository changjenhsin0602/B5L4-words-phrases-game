<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>英文單字大冒險</title>
<style>
:root{
  --bg:#1b1f3b; --card:#ffffff; --ink:#1d2233; --muted:#6b7280;
  --pri:#ff7a59; --pri2:#ffb347; --ok:#22c55e; --bad:#ef4444; --blue:#3b82f6; --purple:#8b5cf6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:radial-gradient(circle at 20% 0%,#3b2f7a 0%,var(--bg) 55%);
  color:var(--ink);min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.screen{display:none;animation:pop .25s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{color:#fff;text-align:center;margin:8px 0 2px;font-size:28px;letter-spacing:1px}
.sub{color:#c7c9e8;text-align:center;margin:0 0 16px;font-size:14px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
label{display:block;font-weight:700;margin:10px 0 6px;font-size:15px}
input,select{width:100%;font-size:18px;padding:12px 14px;border:2px solid #e5e7eb;border-radius:12px;outline:none;font-family:inherit;background:#fff}
input:focus,select:focus{border-color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:800;
  color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-top:14px;cursor:pointer;
  box-shadow:0 5px 0 #c4502f;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4502f}
.btn.ghost{background:#eef0ff;color:#3b3f8f;box-shadow:0 5px 0 #c9cdf5}
.btn.small{padding:10px;font-size:15px;margin-top:8px}
.hello{color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px}
.hello a{color:#ffd28a;text-decoration:none}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px;color:#fff;cursor:pointer;border:0;text-align:left;font-family:inherit;width:100%}
.mode .ic{font-size:36px}
.mode b{font-size:19px;display:block}
.mode span{font-size:13px;opacity:.9}
.mode .best{margin-left:auto;text-align:right;font-size:12px;white-space:nowrap}
.mode .best strong{display:block;font-size:18px}
.m1{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
.m2{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.m3{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.m4{background:linear-gradient(135deg,#10b981,#059669)}
.hud{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px;font-weight:700}
.hud .pill{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:99px;font-size:15px}
.combo{color:#ffd28a}
.combo:empty{visibility:hidden}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);width:100%;transition:width .1s linear}
.q{font-size:30px;font-weight:900;text-align:center;padding:26px 10px;word-break:break-word}
.q small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:700;background:#fff;color:var(--ink);
  box-shadow:0 4px 0 #d1d5db;cursor:pointer;font-family:inherit;text-align:center}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #15803d}
.opt.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 #b91c1c;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{min-height:76px;border:0;border-radius:14px;padding:10px;font-size:16px;font-weight:700;background:#fff;
  box-shadow:0 4px 0 #d1d5db;cursor:pointer;font-family:inherit;color:var(--ink);word-break:break-word}
.mc.en{background:#eef6ff}
.mc.sel{outline:4px solid var(--purple)}
.mc.done{visibility:hidden}
.mc.bad{background:var(--bad);color:#fff;animation:shake .3s}
.spell-hint{font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:6px;text-align:center;margin:6px 0 14px;color:var(--purple);font-weight:900}
.spell input{text-align:center;font-size:24px;font-weight:700;letter-spacing:2px}
.spell input.bad{border-color:var(--bad);animation:shake .3s}
.fb{text-align:center;min-height:26px;font-weight:700;margin-top:8px}
.big{font-size:64px;text-align:center;font-weight:900;color:var(--pri);margin:4px 0}
.stars{text-align:center;font-size:44px;letter-spacing:6px}
.rank{text-align:center;font-size:20px;font-weight:800;margin:6px 0}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.upl{text-align:center;padding:10px;border-radius:12px;font-weight:700;font-size:15px}
.upl.ok{background:#dcfce7;color:#166534}.upl.no{background:#fef3c7;color:#92400e}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.wl{list-style:none;padding:0;margin:0}
.wl li{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #f0f0f0;font-size:17px}
.wl li b{color:var(--blue)}
.wl .x{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:18px}
.tag{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
.demo{background:#fef3c7;color:#92400e;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:28px;font-weight:900;color:#ffd28a;
  pointer-events:none;animation:up .8s ease forwards;z-index:8;text-shadow:0 2px 6px rgba(0,0,0,.4)}
@keyframes up{to{opacity:0;transform:translate(-50%,-60px)}}
.sound.off{opacity:.45}
.sound{position:fixed;right:12px;bottom:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:99px;
  width:44px;height:44px;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <!-- 登入 -->
  <section id="s-login" class="screen">
    <h1>🚀 英文單字大冒險</h1>
    <p class="sub" id="bookTitle"></p>
    <div class="card">
      <div class="row">
        <div><label>班級</label><input id="iCls" placeholder="例：資三甲" maxlength="10"></div>
        <div><label>座號</label><input id="iNo" inputmode="numeric" placeholder="例：7" maxlength="3"></div>
      </div>
      <label>姓名</label><input id="iName" placeholder="你的名字" maxlength="10">
      <button class="btn" id="bLogin">開始冒險 ▶</button>
      <div class="fb" id="loginFb" style="color:var(--bad)"></div>
    </div>
  </section>

  <!-- 首頁 -->
  <section id="s-home" class="screen">
    <div class="hello"><span id="hello"></span><a href="#" id="bLogout">換人</a></div>
    <div class="demo" id="demoNote" style="display:none">⚠️ 目前是示範題目，之後會換成課本內容</div>
    <div class="card">
      <label style="margin-top:0">📚 選擇範圍</label>
      <select id="selLesson"></select>
    </div>
    <div class="modes">
      <button class="mode m1" data-mode="quiz"><span class="ic">⚡</span><div><b>單字快問快答</b><span>10 題限時選擇，連續答對有加分</span></div><div class="best">最高<strong id="best-quiz">-</strong></div></button>
      <button class="mode m2" data-mode="match"><span class="ic">🧩</span><div><b>片語配對</b><span>英文配中文，越快分數越高</span></div><div class="best">最高<strong id="best-match">-</strong></div></button>
      <button class="mode m3" data-mode="spell"><span class="ic">✍️</span><div><b>拼字闖關</b><span>看中文拼英文，練非選填充</span></div><div class="best">最高<strong id="best-spell">-</strong></div></button>
      <button class="mode m4" id="bReview"><span class="ic">📕</span><div><b>我的錯題本</b><span>答錯的字都在這裡，考前必看</span></div><div class="best">共<strong id="wrongCount">0</strong></div></button>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="s-game" class="screen">
    <div class="hud"><span class="pill" id="hudL">1 / 10</span><span class="pill combo" id="hudC"></span><span class="pill" id="hudS">0 分</span></div>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
    <div id="stage"></div>
  </section>

  <!-- 結果 -->
  <section id="s-result" class="screen">
    <div class="card">
      <div class="stars" id="rStars"></div>
      <div class="rank" id="rRank"></div>
      <div class="big" id="rScore">0</div>
      <div class="stat"><div><b id="rRight">0</b>答對</div><div><b id="rWrong">0</b>答錯</div><div><b id="rBest">0</b>最高分</div></div>
      <div class="upl" id="rUpl"></div>
      <div class="code" id="rCode"></div>
      <button class="btn" id="bAgain">再玩一次 🔁</button>
      <button class="btn ghost" id="bHome">回首頁</button>
    </div>
    <div class="card" id="rWrongBox">
      <b>這次答錯的字</b>
      <ul class="wl" id="rWrongList"></ul>
    </div>
  </section>

  <!-- 錯題本 -->
  <section id="s-review" class="screen">
    <div class="hello"><span>📕 我的錯題本</span><a href="#" id="bBack">← 回首頁</a></div>
    <div class="card">
      <ul class="wl" id="reviewList"></ul>
      <button class="btn" id="bPracticeWrong">只練錯題 💪</button>
      <button class="btn ghost small" id="bClearWrong">清空錯題本</button>
    </div>
  </section>
</div>
<button class="sound" id="bMusic" style="bottom:64px" title="背景音樂">🎸</button>
<button class="sound" id="bSound" title="音效">🔊</button>

<script>
/* =========================================================
   ① 成績上傳設定（老師填）
   建好 Google 表單後，把網址和各欄位的 entry 編號填在這裡。
   url 留空 = 不上傳，學生要截圖成績畫面給老師。
   ========================================================= */
const FORM = {
  url: "",            // 例："https://docs.google.com/forms/d/e/1FAIpQL.../formResponse"
  fields: {
    cls:    "",       // 班級   例："entry.111111"
    no:     "",       // 座號
    name:   "",       // 姓名
    lesson: "",       // 範圍
    mode:   "",       // 遊戲
    score:  "",       // 分數
    right:  "",       // 答對題數
    total:  "",       // 總題數
    code:   ""        // 驗證碼
  }
};

/* =========================================================
   ② 題庫（之後換成龍騰第 2 冊內容）
   words:   單字 {en, pos, zh}
   phrases: 片語 {en, zh}
   ========================================================= */
const BOOK = {
  title: "龍騰技高英文 第 5 冊",
  demo: false,
  lessons: [
    { id:"L4", name:"Lesson 4 Mystery of the Disappearing Bees",
      words:[
        {en:"mystery",pos:"n.",zh:"謎團"},
        {en:"mysterious",pos:"adj.",zh:"神祕的"},
        {en:"overnight",pos:"adv.",zh:"突然"},
        {en:"discover",pos:"vt.",zh:"發現"},
        {en:"discovery",pos:"n.",zh:"發現（名詞）"},
        {en:"evidence",pos:"n.",zh:"證據"},
        {en:"miserable",pos:"adj.",zh:"悲慘的"},
        {en:"nightmare",pos:"n.",zh:"夢魘"},
        {en:"factor",pos:"n.",zh:"因素"},
        {en:"pollution",pos:"n.",zh:"汙染"},
        {en:"pollute",pos:"vt.",zh:"汙染（動詞）"},
        {en:"resource",pos:"n.",zh:"資源"},
        {en:"poisonous",pos:"adj.",zh:"有毒的"},
        {en:"poison",pos:"vt.",zh:"毒害"},
        {en:"artificial",pos:"adj.",zh:"人造的"},
        {en:"demonstrate",pos:"vt.",zh:"證明"},
        {en:"worldwide",pos:"adv.",zh:"全球"},
        {en:"supply",pos:"n. / vt.",zh:"供應；提供"},
        {en:"various",pos:"adj.",zh:"各種的"},
        {en:"variety",pos:"n.",zh:"多種樣式"},
        {en:"deserve",pos:"vt.",zh:"應得"},
        {en:"credit",pos:"n.",zh:"讚揚"}
      ],
      phrases:[
        {en:"leave… behind",zh:"丟下（人）；忘記拿（東西）"},
        {en:"result from",zh:"起因於"},
        {en:"pass sth. on (to sb.)",zh:"傳遞"},
        {en:"result in",zh:"導致"},
        {en:"a thing of the past",zh:"過時的事物；歷史"},
        {en:"play a role (in sth.)",zh:"在……中扮演角色"}
      ]}
  ]
};

/* ================= 以下為遊戲程式 ================= */
const $ = s => document.querySelector(s);
const KEY = "vocabQuest_" + BOOK.title;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(KEY+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }
};
let me = store.get("me", null);
let soundOn = store.get("sound", true);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#s-"+id).classList.add("on"); window.scrollTo(0,0); }

/* ---------- 聲音 ---------- */
let actx;
function beep(freqs, dur=0.09, type="sine"){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*dur;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur*1.7);
    });
  }catch(e){}
}
const sOk=()=>beep([660,880]), sBad=()=>beep([220,160],.12,"square"), sWin=()=>beep([523,659,784,1046],.12);
$("#bSound").textContent = soundOn ? "🔊" : "🔇";
$("#bSound").onclick = ()=>{ soundOn=!soundOn; store.set("sound",soundOn); $("#bSound").textContent = soundOn?"🔊":"🔇"; $("#bSound").classList.toggle("off",!soundOn); };


/* ---------- 搖滾背景音樂（程式即時產生，原創旋律） ---------- */
const Rock = (()=>{
  const BPM=168, STEP=60/BPM/2;            // 8 分音符
  let ctx, master, dist, noise, timerId=null, nextT=0, step=0, playing=false;
  const E=41.2, G=49.0, A=55.0, D=36.7, C=32.7, B=30.87, Fs=46.25;
  // 兩段 riff，每段 4 小節 × 8 拍（8 分音符），null = 休止
  const riffA=[E,E,0,E,E,0,G,A,  E,E,0,E,E,0,D,C,  E,E,0,E,E,0,G,A,  B,B,B,B,C,C,D,D];
  const riffB=[A,A,A,A,G,G,G,G,  Fs,Fs,Fs,Fs,G,G,A,A,  A,A,A,A,G,G,G,G,  B,B,B,B,B,0,B,B];
  const song=[...riffA,...riffA,...riffB,...riffA];
  function init(){
    ctx = actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.22; master.connect(ctx.destination);
    dist=ctx.createWaveShaper(); const n=1024, cv=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i*2/n-1; cv[i]=Math.tanh(x*12); } dist.curve=cv;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
    const gg=ctx.createGain(); gg.gain.value=0.16; dist.connect(lp).connect(gg).connect(master);
    noise=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
    const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function env(g,t,a,dur){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(a,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
  function guitar(f,t,dur){
    [f*2, f*3, f*4].forEach((fr,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sawtooth"; o.frequency.value=fr; o.detune.value=i?6:-6; env(g,t,0.5,dur); o.connect(g).connect(dist); o.start(t); o.stop(t+dur+.02); });
  }
  function bass(f,t,dur){ const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=400; o.type="square"; o.frequency.value=f;
    env(g,t,0.35,dur); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+dur+.02); }
  function kick(t){ const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    env(g,t,1.0,0.18); o.connect(g).connect(master); o.start(t); o.stop(t+0.2); }
  function nz(t,type,freq,a,dur){ const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noise; f.type=type; f.frequency.value=freq; env(g,t,a,dur); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+.02); }
  function snare(t){ nz(t,"bandpass",1800,0.7,0.16); const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=190; env(g,t,0.3,0.08); o.connect(g).connect(master); o.start(t); o.stop(t+0.1); }
  function hat(t,open){ nz(t,"highpass",8000,open?0.25:0.15,open?0.12:0.04); }
  function crash(t){ nz(t,"highpass",5000,0.35,1.2); }
  function schedule(){
    while(nextT < ctx.currentTime + 0.15){
      const i=step%song.length, beat=i%8, t=nextT, f=song[i];
      if(f){ guitar(f,t,STEP*0.85); bass(f,t,STEP*0.9); }
      if(beat===0||beat===3||beat===4&&(i%16)>=8||beat===5) kick(t);
      if(beat===2||beat===6) snare(t);
      if(i%8===7 && (i%32)===31) { snare(t); snare(t+STEP/2); }
      hat(t, beat%2===1);
      if(i%64===0) crash(t);
      nextT+=STEP; step++;
    }
  }
  return {
    start(){ if(playing) return; try{ if(!ctx) init(); ctx.resume(); playing=true; nextT=ctx.currentTime+0.05;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(0.22,ctx.currentTime);
      timerId=setInterval(schedule,25); }catch(e){} },
    stop(){ if(!playing) return; playing=false; clearInterval(timerId); },
    get on(){ return playing; }
  };
})();
let musicOn = store.get("music", true);
function syncMusicBtn(){ $("#bMusic").classList.toggle("off",!musicOn); }
syncMusicBtn();
$("#bMusic").onclick = e=>{ e.stopPropagation(); musicOn=!musicOn; store.set("music",musicOn); syncMusicBtn(); musicOn?Rock.start():Rock.stop(); };
$("#bSound").classList.toggle("off",!soundOn);
// 手機規定要先點一下畫面才能播放聲音
document.addEventListener("pointerdown", ()=>{ if(musicOn) Rock.start(); }, {capture:true});

function floatText(t){ const d=document.createElement("div"); d.className="float"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),800); }

/* ---------- 彩帶 ---------- */
let confettiId=0;
function confetti(){
  const c=$("#fx"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#ff7a59","#ffb347","#22c55e","#3b82f6","#8b5cf6","#ec4899"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.random()*6|0],a:Math.random()*6}));
  const id=++confettiId; let n=0; (function f(){ if(id!==confettiId){ x.clearRect(0,0,c.width,c.height); return; } x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.fillStyle=p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++n<180) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------- 登入 / 首頁 ---------- */
$("#bookTitle").textContent = BOOK.title + "｜統測複習";
function goHome(){
  if(!me){ show("login"); return; }
  $("#hello").textContent = `👋 ${me.cls} ${me.no}號 ${me.name}`;
  $("#demoNote").style.display = BOOK.demo ? "block" : "none";
  const sel=$("#selLesson"), cur=sel.value;
  sel.innerHTML = BOOK.lessons.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("") + `<option value="ALL">🔥 全冊大混戰</option>`;
  if(cur) sel.value=cur;
  refreshBest();
  $("#wrongCount").textContent = Object.keys(store.get("wrong",{})).length;
  show("home");
}
function refreshBest(){
  const best=store.get("best",{}), L=$("#selLesson").value;
  ["quiz","match","spell"].forEach(m=>{ $("#best-"+m).textContent = best[L+"|"+m] ?? "-"; });
}
$("#selLesson").onchange = refreshBest;
$("#bLogin").onclick = ()=>{
  const cls=$("#iCls").value.trim(), no=$("#iNo").value.trim(), name=$("#iName").value.trim();
  if(!cls||!no||!name){ $("#loginFb").textContent="班級、座號、姓名都要填喔！"; return; }
  me={cls,no,name}; store.set("me",me); beep([523,784]); goHome();
};
$("#bLogout").onclick = e=>{ e.preventDefault(); me=null; store.set("me",null); $("#iCls").value=$("#iNo").value=$("#iName").value=""; show("login"); };

/* ---------- 題目來源 ---------- */
function pool(L){
  if(L==="ALL") return { words:BOOK.lessons.flatMap(l=>l.words), phrases:BOOK.lessons.flatMap(l=>l.phrases||[]), name:"全冊大混戰" };
  const l=BOOK.lessons.find(x=>x.id===L); return { words:l.words, phrases:l.phrases||[], name:l.name };
}
const allWords = () => BOOK.lessons.flatMap(l=>l.words);
const allItems = () => BOOK.lessons.flatMap(l=>[...l.words,...(l.phrases||[])]);

/* ---------- 錯題本 ---------- */
function addWrong(item){
  const w=store.get("wrong",{}), k=item.en;
  w[k] = { en:item.en, zh:item.zh, pos:item.pos||"片語", n:((w[k]&&w[k].n)||0)+1 };
  store.set("wrong",w);
}
function removeWrong(item){ const w=store.get("wrong",{}); if(w[item.en]){ delete w[item.en]; store.set("wrong",w); } }

/* ---------- 遊戲狀態 ---------- */
let G=null, timer=null;
function startGame(mode, L, custom){
  clearInterval(timer); confettiId++;
  const P = custom || pool(L);
  G = { mode, L, lessonName:P.name, score:0, right:0, wrong:0, combo:0, i:0, wrongList:[], items:[] };
  if(mode==="quiz"){
    const src = P.words.length ? P.words : P.phrases;
    G.items = shuffle(src).slice(0,10); G.total=G.items.length; $("#barWrap").style.visibility="visible"; nextQuiz();
  } else if(mode==="spell"){
    G.items = shuffle(P.words.length?P.words:P.phrases).slice(0,8); G.total=G.items.length; $("#barWrap").style.visibility="hidden"; nextSpell();
  } else {
    let src = P.phrases.length>=6 ? P.phrases : [...P.phrases, ...shuffle(P.words)];
    G.items = shuffle(src).slice(0,6); G.total=G.items.length; $("#barWrap").style.visibility="hidden"; startMatch();
  }
  show("game");
}
function hud(){
  $("#hudL").textContent = G.mode==="match" ? `剩 ${G.items.length-G.right} 組` : `${Math.min(G.i+1,G.total)} / ${G.total}`;
  $("#hudS").textContent = G.score+" 分";
  $("#hudC").textContent = G.combo>=2 ? `🔥 ${G.combo} 連擊` : "";
}

/* ---------- 模式一：快問快答 ---------- */
function nextQuiz(){
  if(G.i>=G.items.length) return finish();
  const it=G.items[G.i], toZh=Math.random()<.6;
  const sameType = (it.pos ? allWords() : allItems()).filter(x=>x.en!==it.en && x.zh!==it.zh);
  const lessonPool = (G.L==="ALL"||G.L==="WRONG") ? sameType : sameType.filter(x=>pool(G.L).words.includes(x));
  const dpool = lessonPool.length>=3 ? lessonPool : sameType;
  const opts = shuffle([it, ...shuffle(dpool).slice(0,3)]);
  $("#stage").innerHTML = `<div class="card"><div class="q">${esc(toZh?it.en:it.zh)}<small>${it.pos?esc(it.pos)+"　":""}${toZh?"選出正確的中文":"選出正確的英文"}</small></div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(toZh?o.zh:o.en)}</button>`).join("")}</div></div>`;
  hud();
  let t=100, locked=false; $("#bar").style.width="100%";
  clearInterval(timer);
  timer=setInterval(()=>{ t-=1; $("#bar").style.width=t+"%"; if(t<=0){ clearInterval(timer); answer(-1); } },100); // 10 秒
  const btns=[...document.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  function answer(k){
    if(locked) return; locked=true; clearInterval(timer);
    const correct = opts.indexOf(it);
    btns[correct].classList.add("ok");
    if(k===correct){
      G.combo++; G.right++;
      const pts = Math.round((100 + t*5) * (1 + Math.min(G.combo-1,5)*0.1));
      G.score+=pts; floatText("+"+pts); sOk(); if(G.L==="WRONG") removeWrong(it);
    } else {
      if(k>=0) btns[k].classList.add("bad"); else floatText("⏰ 時間到");
      G.combo=0; G.wrong++; G.wrongList.push(it); addWrong(it); sBad();
    }
    hud(); G.i++; setTimeout(nextQuiz, k===correct?700:1500);
  }
}

/* ---------- 模式二：片語配對 ---------- */
function startMatch(){
  G.t0=Date.now(); G.miss=0;
  const cards = shuffle(G.items.flatMap((it,idx)=>[{idx,txt:it.en,en:true},{idx,txt:it.zh,en:false}]));
  $("#stage").innerHTML = `<div class="grid">${cards.map((c,k)=>`<button class="mc ${c.en?"en":""}" data-k="${k}">${esc(c.txt)}</button>`).join("")}</div>
    <div class="fb" style="color:#fff" id="mTime">⏱ 0 秒</div>`;
  hud();
  clearInterval(timer); timer=setInterval(()=>{ $("#mTime").textContent=`⏱ ${Math.floor((Date.now()-G.t0)/1000)} 秒`; },500);
  let first=null; const btns=[...document.querySelectorAll(".mc")];
  btns.forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.k]; if(b.classList.contains("done")) return;
    if(first===null){ first=b; b.classList.add("sel"); beep([500]); return; }
    if(first===b){ b.classList.remove("sel"); first=null; return; }
    const fc=cards[+first.dataset.k];
    if(fc.idx===c.idx && fc.en!==c.en){
      G.right++; G.combo++; sOk(); floatText(G.combo>=2?`🔥 ${G.combo} 連擊`:"✓");
      [first,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); });
      if(G.L==="WRONG") removeWrong(G.items[c.idx]);
      first=null; hud();
      if(G.right===G.items.length){ clearInterval(timer);
        const sec=(Date.now()-G.t0)/1000;
        G.score = Math.max(100, Math.round(1200 - sec*12 - G.miss*60));
        G.wrong = G.miss; setTimeout(finish,500); }
    } else {
      G.miss++; G.combo=0; sBad();
      const it=G.items[fc.idx]; if(!G.wrongList.includes(it)){ G.wrongList.push(it); addWrong(it); }
      [first,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"),350); });
      first=null; hud();
    }
  });
}

/* ---------- 模式三：拼字闖關 ---------- */
function nextSpell(){
  if(G.i>=G.items.length) return finish();
  const it=G.items[G.i]; let shown=1, tries=0;
  const ans=it.en.toLowerCase();
  const hint=()=> ans.split("").map((ch,k)=> ch===" " ? "&nbsp;" : (k<shown ? esc(ch) : "_")).join("");
  $("#stage").innerHTML = `<div class="card spell"><div class="q">${esc(it.zh)}<small>${it.pos?esc(it.pos)+"　":""}共 ${ans.replace(/ /g,"").length} 個字母</small></div>
    <div class="spell-hint" id="sh">${hint()}</div>
    <input id="sIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文">
    <div class="row"><button class="btn" id="sGo">送出</button><button class="btn ghost" id="sHint">提示 (-50)</button></div>
    <div class="fb" id="sFb"></div></div>`;
  hud(); const inp=$("#sIn"); setTimeout(()=>inp.focus(),100);
  const done=(ok)=>{
    inp.disabled=true; $("#sGo").disabled=$("#sHint").disabled=true;
    if(ok){ const pts=Math.max(50,150-(shown-1)*50-tries*30); G.score+=pts; G.right++; G.combo++; floatText("+"+pts); sOk();
      $("#sFb").innerHTML=`<span style="color:var(--ok)">✓ 正確！${esc(it.en)}</span>`; if(G.L==="WRONG") removeWrong(it); }
    else { G.wrong++; G.combo=0; G.wrongList.push(it); addWrong(it); sBad();
      $("#sFb").innerHTML=`<span style="color:var(--bad)">答案是：<b>${esc(it.en)}</b></span>`; }
    hud(); G.i++; setTimeout(nextSpell, ok?900:1900);
  };
  const go=()=>{
    const v=inp.value.trim().toLowerCase().replace(/\s+/g," ");
    if(!v) return;
    if(v===ans) return done(true);
    tries++; inp.classList.add("bad"); setTimeout(()=>inp.classList.remove("bad"),350); sBad();
    if(tries>=3) return done(false);
    if(shown<ans.length-1){ shown++; $("#sh").innerHTML=hint(); }
    $("#sFb").innerHTML=`<span style="color:var(--bad)">再試一次！還有 ${3-tries} 次機會</span>`;
    inp.select();
  };
  $("#sGo").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
  $("#sHint").onclick=()=>{ if(shown<ans.length-1){ shown++; $("#sh").innerHTML=hint(); beep([400]); } inp.focus(); };
}

/* ---------- 結算 ---------- */
const MODE_NAME={quiz:"單字快問快答",match:"片語配對",spell:"拼字闖關"};
function hash(s){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36).toUpperCase().slice(-5); }
async function finish(){
  clearInterval(timer);
  const ratio = G.mode==="match" ? Math.max(0, 1 - G.miss/(G.total*2)) : G.right/G.total;
  const stars = ratio>=.9?3:ratio>=.6?2:ratio>=.3?1:0;
  const ranks=["🥚 再接再厲","🐣 英文新手","🦅 英文高手","👑 英文傳說"];
  $("#rStars").textContent = "⭐".repeat(stars)+"☆".repeat(3-stars);
  $("#rRank").textContent = ranks[stars];
  $("#rScore").textContent = G.score;
  $("#rRight").textContent = G.right; $("#rWrong").textContent = G.wrong;
  const best=store.get("best",{}), bk=G.L+"|"+G.mode, isNew = G.L!=="WRONG" && (best[bk]==null || G.score>best[bk]);
  if(isNew){ best[bk]=G.score; store.set("best",best); }
  $("#rBest").textContent = G.L==="WRONG" ? "-" : best[bk];
  if(stars===3||isNew){ confetti(); sWin(); }
  if(isNew && G.score>0) setTimeout(()=>floatText("🎉 新紀錄！"),300);

  const d=new Date(), ts=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const code=hash(`${me.cls}|${me.no}|${G.score}|${G.mode}|${G.L}|${d.toDateString()}`);
  $("#rCode").textContent = `${me.cls} ${me.no}號 ${me.name}｜${G.lessonName}｜${MODE_NAME[G.mode]}｜${ts}｜驗證碼 ${code}`;

  const up=$("#rUpl");
  if(FORM.url){
    up.className="upl"; up.textContent="成績上傳中…";
    const ok = await upload({cls:me.cls,no:me.no,name:me.name,lesson:G.lessonName,mode:MODE_NAME[G.mode],score:G.score,right:G.right,total:G.total,code});
    up.className="upl "+(ok?"ok":"no"); up.textContent = ok ? "✅ 成績已送給老師" : "⚠️ 網路不穩，請截圖這個畫面給老師";
  } else { up.className="upl no"; up.textContent="📸 請截圖這個畫面給老師"; }

  const wl=G.wrongList;
  $("#rWrongBox").style.display = wl.length ? "block":"none";
  $("#rWrongList").innerHTML = wl.map(w=>`<li><b>${esc(w.en)}</b><span>${esc(w.zh)}</span></li>`).join("");
  show("result");
}
async function upload(rec){
  try{
    const body=new URLSearchParams();
    Object.entries(FORM.fields).forEach(([k,id])=>{ if(id) body.append(id, rec[k]); });
    await fetch(FORM.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()});
    return true;
  }catch(e){ return false; }
}
$("#bAgain").onclick=()=>{ if(G.L==="WRONG") practiceWrong(G.mode); else startGame(G.mode,G.L); };
$("#bHome").onclick=goHome;

/* ---------- 錯題本 ---------- */
function renderReview(){
  const w=Object.values(store.get("wrong",{})).sort((a,b)=>b.n-a.n);
  $("#reviewList").innerHTML = w.length ? w.map(x=>`<li><span><b>${esc(x.en)}</b> <span class="x">${esc(x.pos)}</span>${x.n>=2?`<span class="tag">錯 ${x.n} 次</span>`:""}</span><span>${esc(x.zh)}</span></li>`).join("")
    : `<li class="empty">太厲害了，目前沒有錯題 🎉</li>`;
  $("#bPracticeWrong").style.display = w.length>=1 ? "block":"none";
  show("review");
}
function practiceWrong(mode){
  const w=Object.values(store.get("wrong",{}));
  const words=w.filter(x=>x.pos!=="片語"), phrases=w.filter(x=>x.pos==="片語").map(({en,zh})=>({en,zh}));
  const m = mode || (words.length ? "spell" : "match");
  if(m==="match" && phrases.length+words.length<2) return;
  startGame(m,"WRONG",{words, phrases, name:"錯題特訓"});
}
$("#bReview").onclick=renderReview;
$("#bBack").onclick=e=>{ e.preventDefault(); goHome(); };
$("#bPracticeWrong").onclick=()=>practiceWrong();
$("#bClearWrong").onclick=()=>{
  const b=$("#bClearWrong");
  if(b.dataset.sure){ store.set("wrong",{}); delete b.dataset.sure; b.textContent="清空錯題本"; renderReview(); }
  else { b.dataset.sure="1"; b.textContent="再按一次確定清空"; setTimeout(()=>{ delete b.dataset.sure; b.textContent="清空錯題本"; },3000); }
};

document.querySelectorAll(".mode[data-mode]").forEach(b=>b.onclick=()=>startGame(b.dataset.mode,$("#selLesson").value));
goHome();
</script>
